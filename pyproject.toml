[project]
name = "learn3d"
version = "0.1.0"
description = "一問一答的通用學習應用：3D 知識星雲 + 本機 AI 橋接（Claude Code / Codex / Ollama）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
    "claude-agent-sdk>=0.1",
]

[project.scripts]
learn3d-bridge = "learn3d:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
